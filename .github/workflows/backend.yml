name: Backend
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: depradar
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: depradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U depradar -d depradar_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DEPRADAR_TEST_DATABASE_URL: postgresql+psycopg://depradar:test-only-password@localhost:5432/depradar_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  ci-client:
    name: CI client on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Official Python images, as customer CI images use: setup-python has no 3.9 build for
    # newer runner images, and the client must keep working on 3.9.
    container: python:${{ matrix.python }}-slim
    strategy:
      matrix:
        # The downloadable client promises Python 3.9+ for older CI images.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run the standard-library client
        shell: bash
        run: |
          python -I backend/src/depradar/ci_client.py --version
          set +e
          DEPRADAR_TOKEN= python -I backend/src/depradar/ci_client.py scan --url https://depradar.invalid
          test $? -eq 2

  integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PostgreSQL, real OSV, captured SMTP and Telegram protocol verification
        run: docker compose -f compose.verify.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Integration logs
        if: always()
        run: docker compose -f compose.verify.yaml logs --no-color
      - name: Remove disposable verification environment
        if: always()
        run: docker compose -f compose.verify.yaml down -v

  mcp-stack:
    name: MCP against the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.1
      - name: Start the production Compose stack with MCP on
        run: |
          password=$(openssl rand -hex 16) bootstrap=$(openssl rand -hex 24) owner=$(openssl rand -hex 16)
          echo "::add-mask::$password"; echo "::add-mask::$bootstrap"; echo "::add-mask::$owner"
          {
            echo "STACK_ENV_FILE=$RUNNER_TEMP/mcp-stack.env"
            echo "DEPRADAR_STACK_BOOTSTRAP_TOKEN=$bootstrap"
            echo "DEPRADAR_STACK_OWNER_PASSWORD=$owner"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/mcp-stack.env" <<EOF
          POSTGRES_PASSWORD=$password
          DEPRADAR_BOOTSTRAP_TOKEN=$bootstrap
          DEPRADAR_API_PORT=8010
          DEPRADAR_MCP_ENABLED=true
          DEPRADAR_MCP_RATE_LIMIT_PER_MINUTE=60
          DEPRADAR_MCP_ALLOWED_ORIGINS=["https://assistant.example.test"]
          EOF
          docker compose --project-name depradar-mcp --env-file "$RUNNER_TEMP/mcp-stack.env" \
            up --detach --build api worker
      - name: Assistants through the official MCP client
        working-directory: backend
        env:
          DEPRADAR_STACK_URL: http://127.0.0.1:8010
          DEPRADAR_STACK_RATE_LIMIT: "60"
          DEPRADAR_STACK_ALLOWED_ORIGIN: https://assistant.example.test
        run: |
          uv sync --locked
          uv run pytest -q tests/test_mcp_stack.py
      - name: Stack logs
        if: failure()
        run: >-
          docker compose --project-name depradar-mcp --env-file "$STACK_ENV_FILE"
          logs --no-color api worker scanner
      - name: Remove the stack
        if: always()
        run: docker compose --project-name depradar-mcp --env-file "$STACK_ENV_FILE" down -v
