# DepRadar gating its own dependencies with the bundled action.
# Enable it by adding a DEPRADAR_URL repository variable and a DEPRADAR_TOKEN secret. The server
# must be reachable from the runner; use a self-hosted runner for a private-network instance.
name: Dependency gate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  depradar:
    # Fork pull requests receive no secrets, so they are skipped rather than failed.
    if: >-
      vars.DEPRADAR_URL != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./integrations/github-action
        with:
          url: ${{ vars.DEPRADAR_URL }}
          token: ${{ secrets.DEPRADAR_TOKEN }}
          project: depradar
          # The deliberately vulnerable example and test fixtures are not shipped code.
          exclude: |
            backend/examples/*
            backend/tests/*
          fail-on: high
