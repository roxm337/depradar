# Production overlay, applied by deploy/depradarctl on top of compose.yaml:
#   docker compose -f compose.yaml -f deploy/compose.production.yaml -f /etc/depradar/compose.ports.yaml
# Adds the web interface and the Caddy edge proxy, restart policies, and public-URL settings.
# Ports are published only by the generated ports file, which depends on the install mode.

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    restart: unless-stopped

  api:
    restart: unless-stopped
    # Reached through the edge proxy only; nothing is published on the host.
    ports: !reset []
    environment:
      DEPRADAR_ALLOWED_ORIGIN: ${DEPRADAR_PUBLIC_URL:?Set DEPRADAR_PUBLIC_URL}
      DEPRADAR_DASHBOARD_URL: ${DEPRADAR_PUBLIC_URL:?Set DEPRADAR_PUBLIC_URL}
      DEPRADAR_SECURE_COOKIES: ${DEPRADAR_SECURE_COOKIES:-true}
    networks: [app, egress, edge]

  worker:
    restart: unless-stopped
    environment:
      DEPRADAR_DASHBOARD_URL: ${DEPRADAR_PUBLIC_URL:?Set DEPRADAR_PUBLIC_URL}

  scanner:
    restart: unless-stopped

  web:
    <<: *hardened
    build:
      context: ./front
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    environment:
      DEPRADAR_API_URL: http://api:8000
      DEPRADAR_ALLOWED_ORIGIN: ${DEPRADAR_PUBLIC_URL:?Set DEPRADAR_PUBLIC_URL}
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  proxy:
    <<: *hardened
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${DEPRADAR_CONFIG_DIR:-/etc/depradar}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  # Proxy ⇄ web ⇄ API, plus outbound access for certificate issuance.
  edge: {}

volumes:
  caddy-data: {}
  caddy-config: {}
